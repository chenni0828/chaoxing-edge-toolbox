name: 构建 Edge 扩展

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: 检查并构建 dist
        run: npm run check
      - name: 打包扩展
        run: node scripts/package.mjs
      - name: 上传可下载扩展包
        uses: actions/upload-artifact@v4
        with:
          name: chaoxing-edge-toolbox-${{ github.sha }}
          path: release/*.zip
          if-no-files-found: error
          retention-days: 30
