<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>设置 · 学习工具箱</title>
    <link rel="stylesheet" href="./style.css" />
    <script type="module" src="./index.js"></script>
  </head>
  <body>
    <div class="page">
      <header class="page-header">
        <div class="brand-mark" aria-hidden="true"></div>
        <div><p class="eyebrow">学习工具箱 <span id="version"></span></p><h1>全局设置</h1></div>
        <div id="settings-update" class="update-check"></div>
      </header>
      <p class="intro">按网站管理功能，共用悬浮框外观；模型服务仅供学习通 AI 作答使用。</p>
      <nav class="settings-nav" aria-label="设置分类">
        <a href="#features" aria-current="page">功能设置</a>
        <a href="#api">学习通 API</a>
        <a href="#floating">悬浮框设置</a>
      </nav>
      <main>
        <section id="settings-api" aria-label="学习通 API 设置" hidden></section>
        <section id="settings-features" aria-label="功能设置"></section>
        <section id="settings-floating" aria-label="悬浮框设置" hidden></section>
        <details class="usage-note">
          <summary>网页使用与更新提示</summary>
          <div>
          <p>打开学习通或浙学页面，工具箱会显示当前网站支持的功能；也可点击 Edge 扩展图标打开悬浮工具箱。</p>
          <p>安装或更新后，在 <code>edge://extensions</code> 重新加载扩展，并刷新已打开的学习页面。</p>
          </div>
        </details>
      </main>
      <footer>学习工具箱 · 页面辅助工具</footer>
    </div>
  </body>
</html>
