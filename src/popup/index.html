<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>学习工具箱</title>
    <link rel="stylesheet" href="./style.css" />
    <script type="module" src="./index.js"></script>
  </head>
  <body>
    <header>
      <div class="brand-mark" aria-hidden="true"></div>
      <div class="brand-copy"><h1>学习工具箱</h1><p>常用操作，就在网页旁</p></div>
      <button id="open-settings" class="settings-link" type="button">设置</button>
    </header>
    <main>
      <section class="launcher" aria-label="网页工具箱入口">
        <p id="page-hint" role="status">正在检查当前页面…</p>
        <p id="page-details" class="hint">正在识别页面可用能力…</p>
        <button id="open-panel" class="primary" type="button" disabled hidden>打开悬浮工具箱</button>
        <p id="panel-note" class="panel-note" role="status" hidden></p>
      </section>
      <section class="api-summary" aria-label="学习通 API 配置状态" hidden>
        <div class="api-copy"><p id="api-hint" role="status">正在读取 API 配置…</p><p id="api-model-hint"></p></div>
        <button id="open-api-settings" class="api-link" type="button">API 设置</button>
      </section>
      <p id="feedback" class="feedback" role="status" aria-live="polite" hidden></p>
      <p class="footnote"><span id="version" class="version"></span> · 安装或更新后，请刷新已打开的学习页面。</p>
    </main>
  </body>
</html>
